site_name: minimal_python_project_skeleton
repo_url: https://github.com/MArpogaus/minimal_python_project_skeleton  # TODO: Change project repo
strict: true
theme:
  name: material
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths: [src]
        options:
          docstring_style: numpy
markdown_extensions:
- pymdownx.snippets
nav:
- Home: index.md
- API: api.md
extra:
  version:
    provider: mike
