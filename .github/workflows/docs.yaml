# Build the MkDocs site and publish one version per branch with mike:
# main is the default version `latest`, every dev branch sits beside it.
name: Build and deploy documentation
on:
  push:
    branches: [main, dev, dev-*]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # mike pushes gh-pages
    env:
      REF: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # mike reads and writes gh-pages
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - run: pip install -e .[docs]
    - run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [ "$REF" = main ]; then
          mike deploy --push --update-aliases main latest
          mike set-default --push latest
        else
          mike deploy --push "$REF"
        fi
